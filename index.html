<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>鹈鹕骑士 · Pelican Ride 3D</title>
<meta name="description" content="一只鹈鹕骑自行车的 3D 交互场景：Three.js 全程序化生成，无任何外部素材。"/>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='40' fill='none' stroke='%23cf3f36' stroke-width='10'/%3E%3Ccircle cx='50' cy='50' r='8' fill='%23cf3f36'/%3E%3C/svg%3E"/>
<style>
  :root{
    --glass: rgba(255,255,255,.13);
    --stroke: rgba(255,255,255,.32);
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; height: 100%; overflow: hidden; background: #0a1020; color: #fff;
    font-family: ui-rounded, -apple-system, "SF Pro Rounded", "PingFang SC", "Hiragino Sans GB", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  #gl{ position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #gl:active{ cursor: grabbing; }
  .vignette{
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(120% 90% at 50% 42%, transparent 58%, rgba(4,9,24,.42) 100%);
  }
  .hud{ position: fixed; inset: 0; pointer-events: none; z-index: 10; }
  .hud > *{ pointer-events: auto; }

  .title-block{
    position: absolute; top: calc(16px + env(safe-area-inset-top)); left: 20px;
    text-shadow: 0 2px 20px rgba(8,15,40,.45); user-select: none;
  }
  .title-block h1{ margin: 0; font-size: clamp(20px, 3.2vw, 30px); font-weight: 800; letter-spacing: .04em; }
  .title-block p{ margin: 4px 0 0; font-size: 12px; letter-spacing: .28em; opacity: .78; text-transform: uppercase; }

  .top-right{
    position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 20px;
    display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end;
  }
  .pill{
    appearance: none; border: 1px solid var(--stroke); color: #fff; background: var(--glass);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 600;
    font-family: inherit; cursor: pointer; transition: background .2s, transform .12s;
    text-shadow: 0 1px 8px rgba(8,15,40,.3);
  }
  .pill:hover{ background: rgba(255,255,255,.28); }
  .pill:active{ transform: scale(.96); }

  .dock{
    position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px;
    padding: 10px 18px; border-radius: 999px;
    background: var(--glass); border: 1px solid var(--stroke);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 30px rgba(5,10,30,.25);
  }
  .dock label{ font-size: 11px; letter-spacing: .18em; opacity: .85; white-space: nowrap; font-weight: 700; }
  .dock input[type=range]{ width: clamp(120px, 26vw, 260px); accent-color: #ffd166; cursor: pointer; }
  .dock output{ font-size: 12px; font-weight: 700; min-width: 44px; text-align: right; font-variant-numeric: tabular-nums; }

  .hint{
    position: absolute; right: 20px; bottom: calc(20px + env(safe-area-inset-bottom));
    font-size: 11.5px; line-height: 1.9; opacity: .72; text-align: right;
    text-shadow: 0 1px 10px rgba(8,15,40,.5); user-select: none; max-width: 260px;
  }

  #loader{
    position: fixed; inset: 0; z-index: 50; display: grid; place-items: center;
    background: linear-gradient(180deg, #2e6fd6 0%, #7db2ec 55%, #cfe9ff 100%);
    transition: opacity .9s ease, visibility .9s;
  }
  #loader.done{ opacity: 0; visibility: hidden; }
  .loader-card{ text-align: center; text-shadow: 0 2px 18px rgba(10,25,60,.35); }
  .loader-card h2{ margin: 0; font-size: clamp(26px, 5vw, 44px); font-weight: 800; letter-spacing: .08em; }
  .loader-card p{ margin: 10px 0 0; font-size: 13px; letter-spacing: .32em; opacity: .85; }
  .spinner{
    width: 44px; height: 44px; margin: 22px auto 0; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  #fatal{
    position: fixed; inset: 0; z-index: 99; display: grid; place-items: center;
    background: #101828; padding: 28px; text-align: center; font-size: 15px; line-height: 1.8;
  }
  #fatal[hidden]{ display: none; }

  @media (max-width: 720px){
    .hint{ display: none; }
    .title-block p{ letter-spacing: .18em; }
    .dock{ gap: 10px; padding: 9px 14px; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="vignette"></div>

<div class="hud">
  <div class="title-block">
    <h1>鹈鹕骑士</h1>
    <p>Pelican &middot; 3D Bicycle Ride</p>
  </div>
  <div class="top-right">
    <button class="pill" id="btnNight" aria-label="切换昼夜">夜晚</button>
    <button class="pill" id="btnDing" aria-label="按响车铃">按铃 Ding</button>
    <button class="pill" id="btnCam" aria-label="切换视角">视角：环绕</button>
  </div>
  <div class="dock">
    <label for="speed">踩踏动力</label>
    <input id="speed" type="range" min="0" max="8" step="0.1" value="3.2"/>
    <output id="speedVal">3.2</output>
  </div>
  <div class="hint">
    拖拽旋转 · 滚轮缩放 · 点击画面撒羽毛<br/>
    ↑↓ 车速 &nbsp; B 车铃 &nbsp; N 昼夜 &nbsp; C 视角
  </div>
</div>

<div id="loader">
  <div class="loader-card">
    <h2>鹈鹕骑士</h2>
    <p>正在唤醒翅膀…</p>
    <div class="spinner"></div>
  </div>
</div>
<div id="fatal" hidden></div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/examples/jsm/"
  }
}
</script>
<script type="module" src="./js/app.js"></script>
</body>
</html>
